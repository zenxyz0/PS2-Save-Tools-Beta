name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/*' -name '*.apk' | head -n1)
          gh release create "build-${{ github.run_number }}" "$APK" --title "Build ${{ github.run_number }}" --notes "APK dari ${{ github.sha }}" --target ${{ github.sha }}
